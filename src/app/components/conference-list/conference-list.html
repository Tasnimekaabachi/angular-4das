<z-card class="border-l-4 border-l-teal-600">
  <z-card-header>
    <z-card-title zTitle="📅 Liste des conférences à venir" />
    <z-card-description zDescription="Recherchez une conférence et inscrivez-vous." />
  </z-card-header>

  <z-card-content class="space-y-4">
    <input z-input class="max-w-md" placeholder="Taper le titre de la conférence" aria-label="Rechercher une conférence"
           [(ngModel)]="search" />

    @if (conferences().length === 0) {
      <p class="text-muted-foreground">Aucune conférence n'est enregistrée.</p>
    } @else {
      <div class="grid gap-4 sm:grid-cols-2 lg:grid-cols-3">
        @for (c of filtered(); track c.id) {
          <z-card class="bg-muted/40">
            <z-card-header>
              <z-card-title class="text-blue-900 dark:text-blue-300" [zTitle]="c.title | uppercase" />
              <z-card-description [zDescription]="c.description" />
            </z-card-header>
            <z-card-content class="space-y-1">
              <p><strong>Date :</strong> {{ c.date | date: 'dd/MM/yyyy' }}</p>
              <p><strong>Lieu :</strong> {{ c.place }}</p>
              <p><strong>Places restantes :</strong> {{ remaining(c) }}</p>
            </z-card-content>
            <z-card-footer>
              <button z-button [class]="buttonClass(c)" [zDisabled]="remaining(c) === 0" (click)="register(c.id)">
                S'inscrire
              </button>
            </z-card-footer>
          </z-card>
        } @empty {
          <p class="text-muted-foreground">Aucune conférence ne correspond à « {{ search() }} ».</p>
        }
      </div>
    }
  </z-card-content>
</z-card>
